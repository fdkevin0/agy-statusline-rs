[package]
name = "agy-statusline"
version = "0.1.1"
edition = "2021"
description = "Safe Rust statusline for Antigravity CLI (agy) with quota pacing, compaction sniffing, git worktree awareness, and a 3-pane TUI configurator."
license = "MIT"
repository = "https://github.com/fdkevin0/agy-statusline-rs"
readme = "README.md"
keywords = ["cli", "statusline", "sqlite", "antigravity"]
categories = ["command-line-utilities"]
include = ["src/**/*", "tests/**/*", "Cargo.toml", "README.md", "LICENSE"]

[features]
default = ["bundled"]
bundled = ["rusqlite/bundled"]

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
rusqlite = "0.43"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
