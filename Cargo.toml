[package]
name = "agy-statusline"
version = "0.4.7"
edition = "2021"
description = "Safe Rust statusline for Antigravity CLI (agy) with quota pacing, compaction sniffing, git worktree awareness, and a 3-pane TUI configurator."
license = "MIT"
repository = "https://github.com/fdkevin0/agy-statusline-rs"
readme = "README.md"
keywords = ["cli", "statusline", "sqlite", "antigravity"]
categories = ["command-line-utilities"]
include = ["src/**/*", "tests/**/*", "Cargo.toml", "README.md", "LICENSE"]

[features]
default = ["bundled"]
bundled = ["rusqlite/bundled"]

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
crossterm = "0.29"
jiff = { version = "1.0", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
nucleo-matcher = "0.3"
prost = "0.14"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rusqlite = { version = "0.43", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strip-ansi-escapes = "0.2"
tempfile = "3"
tui-input = { version = "0.15", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"
which = "8"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
