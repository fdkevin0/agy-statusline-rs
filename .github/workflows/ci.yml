name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install SQLite development headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit and integration tests (default bundled)
        run: cargo test --locked --all-targets
      - name: Unit and integration tests (system SQLite)
        run: cargo test --locked --no-default-features --all-targets
      - name: Doc tests
        run: cargo test --locked --doc
