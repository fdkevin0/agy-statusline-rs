name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: agy-statusline-linux-x64
            ext: tar.gz
            cargo_flags: "--features bundled"
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: agy-statusline-macos-arm64
            ext: tar.gz
            cargo_flags: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: agy-statusline-windows-x64
            ext: zip
            cargo_flags: "--features bundled"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        shell: bash
        run: |
          cargo build --release --locked --target "${{ matrix.target }}" ${{ matrix.cargo_flags }}
          mkdir -p dist
          if [ "${{ matrix.ext }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/agy-statusline.exe" dist/
            (cd dist && 7z a "../${{ matrix.artifact }}.zip" agy-statusline.exe)
          else
            cp "target/${{ matrix.target }}/release/agy-statusline" dist/
            tar -C dist -czf "${{ matrix.artifact }}.tar.gz" agy-statusline
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "artifacts/*"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
      - name: Publish to crates.io (when CARGO_REGISTRY_TOKEN is configured)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            cargo publish --locked
          else
            echo "CARGO_REGISTRY_TOKEN not set; skipping crates.io publish."
          fi
