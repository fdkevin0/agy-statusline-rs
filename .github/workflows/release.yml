name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: agy-statusline-linux-x64
            ext: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: agy-statusline-linux-x64-musl
            ext: tar.gz
            cross_gcc: musl-tools
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: agy-statusline-linux-arm64
            ext: tar.gz
            cross_gcc: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: agy-statusline-macos-arm64
            ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: agy-statusline-macos-x64
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: agy-statusline-windows-x64
            ext: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compilation toolchain
        if: matrix.cross_gcc != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y "${{ matrix.cross_gcc }}"
      - name: Build release binary
        shell: bash
        env:
          CC_aarch64_unknown_linux_gnu: ${{ matrix.linker }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: |
          cargo build --release --locked --features bundled --target "${{ matrix.target }}"
          mkdir -p dist
          if [ "${{ matrix.ext }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/agy-statusline.exe" dist/
            (cd dist && 7z a "../${{ matrix.artifact }}.zip" agy-statusline.exe)
          else
            cp "target/${{ matrix.target }}/release/agy-statusline" dist/
            tar -C dist -czf "${{ matrix.artifact }}.tar.gz" agy-statusline
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "artifacts/*"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  publish-crates:
    name: publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Install SQLite development headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config
      - name: Authenticate with crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
